name: cli2api-ai

# ── Shared environment ──────────────────────────────────────────────────────
# Auth is injected automatically:
#   - Copilot: entrypoint.sh extracts host `gh auth login` from ~/.config/gh
#   - Antigravity: entrypoint.sh and worker use ~/.gemini mounted from host
x-common-env: &common-env
  REDIS_URL: redis://redis:6379
  API_KEYS: ${API_KEYS:-}
  API_KEY: ${API_KEY}
  RATE_LIMIT_RPM: ${RATE_LIMIT_RPM:-60}
  PUBLIC_HEALTH: ${PUBLIC_HEALTH:-true}

  # Active Provider: 'copilot' or 'antigravity'
  PROVIDER: ${PROVIDER:-copilot}

  # ── Antigravity options ──
  ANTIGRAVITY_MODEL: ${ANTIGRAVITY_MODEL:-gemini-3.8-flash-high}
  ANTIGRAVITY_EFFORT: ${ANTIGRAVITY_EFFORT:-}
  AGY_PATH: ${AGY_PATH:-}

  # ── Copilot options ──
  # API backend:
  #   https://api.githubcopilot.com          ← Copilot API (default)
  COPILOT_BASE_URL: ${COPILOT_BASE_URL:-https://api.githubcopilot.com}
  # Default model (can be overridden per request via ?model= query param)
  COPILOT_MODEL: ${COPILOT_MODEL:-gpt-4o-mini}

services:
  # ── Reverse proxy (TLS termination) ────────────────────────────────────
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_started
    networks:
      - backend

  # ── Redis (internal only) ──────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - backend

  # ── FastAPI ────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: uvicorn api:app --host 0.0.0.0 --port 8000
    environment:
      <<: *common-env
    volumes:
      - "${GH_CONFIG_DIR:-$HOME/.config/gh}:/gh-config-ro:ro"
      - "${GEMINI_DIR:-$HOME/.gemini}:/root/.gemini"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - backend

  # ── RQ Worker ──────────────────────────────────────────────────────────
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: python worker.py
    environment:
      <<: *common-env
    volumes:
      - "${GH_CONFIG_DIR:-$HOME/.config/gh}:/gh-config-ro:ro"
      - "${GEMINI_DIR:-$HOME/.gemini}:/root/.gemini"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - backend

volumes:
  caddy_data:
  caddy_config:

networks:
  backend:
